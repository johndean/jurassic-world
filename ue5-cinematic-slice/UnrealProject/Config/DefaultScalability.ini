; =============================================================================
; JSISlice — DefaultScalability.ini
; Three quality buckets mapped to the device tiers. A Device Profile (set up in
; the editor: Project Settings > Platforms > iOS, or Window > Device Profiles)
; selects the scalability LEVEL per chip:
;
;   Level 1  → BASELINE  : A12Z / A13–A15  (iPad 9th/10th, Pro 4th gen, mini6, Air4)
;   Level 3  → ENHANCED  : M1–M3 iPad Pro/Air
;   Level 4  → SHOWCASE  : iPad Pro M4 (11"/13")  (+ Nanite/RT trial, set in DeviceProfile)
;
; Author content to LEVEL 1 first — it is the design floor. Levels 3/4 add density
; and dynamic effects on top of the same baked content.
; Only the groups that differ across tiers are listed; engine defaults cover the rest.
; CVar availability can vary by UE version — [verify] against your engine.
; =============================================================================

; ---------------- View distance ----------------
[ViewDistanceQuality@1]
r.ViewDistanceScale=0.6                 ; short draw distance — fog hides the cull line
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@4]
r.ViewDistanceScale=1.3

; ---------------- Shadows ----------------
[ShadowQuality@1]
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=1
r.DistanceFieldShadowing=0
[ShadowQuality@3]
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=2
[ShadowQuality@4]
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=3

; ---------------- Foliage / effects density ----------------
[FoliageQuality@1]
foliage.DensityScale=0.5
grass.DensityScale=0.5
[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
[FoliageQuality@4]
foliage.DensityScale=1.0
grass.DensityScale=1.0

; ---------------- Post-processing (AO/DoF/bloom richness) ----------------
[PostProcessQuality@1]
r.Mobile.AmbientOcclusion=0
r.DepthOfFieldQuality=0
r.BloomQuality=4
[PostProcessQuality@3]
r.Mobile.AmbientOcclusion=1
r.DepthOfFieldQuality=1
r.BloomQuality=5
[PostProcessQuality@4]
r.Mobile.AmbientOcclusion=1
r.DepthOfFieldQuality=2
r.BloomQuality=5

; ---------------- Textures ----------------
[TextureQuality@1]
r.Streaming.MipBias=1                    ; 1K–2K effective; protect the 6 GB A12Z budget
[TextureQuality@3]
r.Streaming.MipBias=0                    ; 2K
[TextureQuality@4]
r.Streaming.MipBias=0                    ; up to 4K (set per-texture LOD groups)

; ---------------- Anti-aliasing ----------------
[AntiAliasingQuality@1]
r.MobileMSAA=2
[AntiAliasingQuality@3]
r.MobileMSAA=4
[AntiAliasingQuality@4]
r.MobileMSAA=4
