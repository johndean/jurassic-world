; =============================================================================
; JSISlice — DefaultEngine.ini
; Native iPad (iOS/Metal), Mobile rendering path, BAKED lighting.
; Floor = iPad 9th gen (A13) / iPad Pro 4th gen (A12Z). Nanite + Lumen are OFF.
; "Cinematic" = Megascans PBR + baked GI + post-processing, scaled up per tier.
;
; NOTE: a few CVars move between UE 5.4 / 5.5 — keys flagged [verify] should be
; confirmed in your installed engine (Project Settings writes the canonical form).
; This file front-loads the decisions so the project starts in the right mode.
; =============================================================================

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_ValleySlice
EditorStartupMap=/Game/Maps/L_ValleySlice

; ---------------------------------------------------------------- Renderer ----
[/Script/Engine.RendererSettings]
; Mobile renderer, FORWARD shading (cheap, MSAA-friendly — right for a baked scene on A12Z/A13)
r.Mobile.ShadingPath=0
r.MobileHDR=True                              ; needed for tonemapping/bloom/grading (the cinematic look)
r.Mobile.AllowDistanceFieldShadows=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableSpotlightsShadow=False  ; baseline: no dynamic spot shadows
; Baked lighting ON; realtime GI OFF (no Lumen at the floor)
r.AllowStaticLighting=True
r.DynamicGlobalIlluminationMethod=0           ; 0 = None (use baked GI / lightmaps) [verify enum]
r.ReflectionMethod=0                          ; mobile = reflection captures, not SSR/Lumen [verify enum]
; Nanite OFF (no support at the A12Z/A13 floor)
r.Nanite.ProjectEnabled=False
; Virtual Shadow Maps OFF (desktop/console feature)
r.Shadow.Virtual.Enable=0
; Anti-aliasing: MSAA on the mobile forward path
r.MobileMSAA=4                                ; 4x MSAA; drop to 2 if GPU-bound on A13 [verify]
r.AntiAliasingMethod=2                         ; 2 = MSAA [verify enum]
; Ambient occlusion: OFF at baseline (Enhanced/Showcase re-enable via scalability)
r.Mobile.AmbientOcclusion=0                    ; [verify — UE5 mobile SSAO]
; Sane mobile defaults
r.Shadow.CSM.MaxMobileCascades=1
r.MobileNumDynamicPointLights=4

; --------------------------------------------------------- iOS / iPadOS ------
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
bSupportsMetal=True
bSupportsMetalMRT=False                        ; MetalMRT = desktop/deferred path; OFF for mobile forward on A12Z
MinimumiOSVersion=IOS_16                        ; [verify enum] floor devices run iPadOS 18.5+; 16 is a safe min
bSupportsIPad=True
bSupportsIPhone=False                          ; iPad-only target
bSupportsHighRefreshRate=True                   ; ProMotion 120 Hz on M-series (Showcase)
PreferredLandscapeOrientation=LandscapeLeft
bSupportsPortraitOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
BundleDisplayName=Jurassic Survival
BundleName=JurassicSurvival
; bundle id + signing team are set per-developer in Project Settings (do NOT commit a team id)

; ------------------------------------------------------------- Cooking -------
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Shipping
bUseIoStore=True
bCompressed=True
; Texture streaming pool kept tight for the 6 GB A12Z budget — tuned later via profiling

; ------------------------------------------------ Target platform shaders ----
[/Script/Engine.RendererOverrideSettings]
; (placeholder section; per-platform shader perms set when iOS target is added in the editor)
